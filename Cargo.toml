[package]
name = "nativelite-vterm"
version = "0.5.5"
edition = "2021"
rust-version = "1.70"
description = "A minimal terminal-emulator core: child VT output bytes in, a live ansi::Screen out. Zero third-party dependencies; depends only on the nativelite ansi and uwidth crates."
license = "MIT"
repository = "https://github.com/nativelite/vterm-rs"
keywords = ["terminal", "emulator", "vt100", "ansi", "nativelite"]
categories = ["command-line-interface", "emulators"]

# nativelite core rule: ZERO third-party dependencies. The only dependencies
# allowed are org crates (the app-variant rule): `ansi` for the screen model and
# `uwidth` for Unicode display width — do not add anything from crates.io here.
[dependencies]
ansi = { package = "nativelite-ansi", version = "0.4.1", path = "../ansi-rs" }
uwidth = { package = "nativelite-uwidth", version = "0.1", path = "../uwidth-rs" }

[lib]
name = "vterm"
path = "src/lib.rs"

# `cargo bench --bench feed_throughput`: a stdlib-only `main()` timing
# `Term::feed`, no benchmark framework (see benches/README.md). Under
# `cargo test --all-targets` it only builds and returns.
[[bench]]
name = "feed_throughput"
harness = false
